# NOTE: the root filesystem type is NOT configured here on purpose.
# bootc-image-builder's TOML config has no "rootfs" key (setting one fails with
# "unknown keys found: [rootfs]"); it must be passed as the "--rootfs" CLI
# option, which this repo does through the action's dedicated `rootfs` input.
# See disk_config/README.md for the full explanation.

[[customizations.filesystem]]
mountpoint = "/"
minsize = "20 GiB"

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/manitosik/maos:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
