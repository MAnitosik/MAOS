---
name: Build disk images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'installer/**'
      - 'image-template.env'
      - 'Justfile'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_REGISTRY: 'ghcr.io/${{ github.repository_owner }}'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  build:
    name: Build Anaconda ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read  # pull the installer and payload images from ghcr.io

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      # image-template.env is the single source of truth. build.yml publishes the payload
      # and the installer under these names.
      - name: Resolve image names and tag
        run: |
          set -euo pipefail
          image_name="$(just image_name)"
          default_tag="$(just generate-default-tag)"
          image="${IMAGE_REGISTRY,,}/${image_name,,}"
          {
            echo "PAYLOAD_IMAGE=${image}:${default_tag}"
            echo "INSTALLER_IMAGE=${image}-installer:${default_tag}"
          } >> "${GITHUB_ENV}"

      # The action pulls both images with sudo podman, so log in as root to read private packages.
      - name: Login to GitHub Container Registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_PASSWORD}" | sudo podman login ghcr.io --username "${REGISTRY_USER}" --password-stdin

      - name: Build ISO
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36 # main
        with:
          image_type: bootc-generic-iso
          bootc_ref: ${{ env.INSTALLER_IMAGE }}
          bootc_installer_payload_ref: ${{ env.PAYLOAD_IMAGE }}
          # Required for Fedora images. Anaconda chooses the installed layout from
          # installer/anaconda/99-maos.conf, so this value only satisfies validation.
          bootc_default_fs: btrfs
          # A release image. Bump it deliberately.
          image_builder_ref: ghcr.io/osbuild/image-builder-cli:v69

      - name: Generate SHA-256 checksum
        working-directory: output
        run: |
          set -euo pipefail
          mapfile -d '' isos < <(find . -type f -name '*.iso' -print0)
          if (( ${#isos[@]} == 0 )); then
            echo "::error::No ISO was produced"
            exit 1
          fi
          sha256sum "${isos[@]}" > SHA256SUMS

      - name: Upload ISO and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anaconda-iso
          path: output
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
