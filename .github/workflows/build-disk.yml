---
name: Build disk images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/iso.toml'
      - 'image-template.env'
      - 'Justfile'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_REGISTRY: 'ghcr.io/${{ github.repository_owner }}'

# One run per ref. Runs on the default branch queue instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  build:
    name: Build Anaconda ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read  # pull the published image from ghcr.io

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      # Read the image name, tag and builder from image-template.env through the
      # Justfile, the same source build.yml uses. This job then consumes exactly the
      # image that build.yml publishes.
      - name: Resolve image name, tag and builder image
        run: |
          set -euo pipefail
          image_name="$(just image_name)"
          default_tag="$(just generate-default-tag)"
          bib_image="$(just --evaluate bib_image)"
          {
            echo "IMAGE_NAME=${image_name,,}"        # GHCR requires lowercase repository paths
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "DEFAULT_TAG=${default_tag}"
            echo "BIB_IMAGE=${bib_image}"
            echo "USER_UID=$(id -u)"
            echo "USER_GID=$(id -g)"
          } >> "${GITHUB_ENV}"

      # Upstream has deprecated this action in favor of osbuild/image-builder-action,
      # which cannot take a config-file such as disk_config/iso.toml. Keep it until
      # the replacement supports that config.
      - name: Build ISO
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Generate SHA-256 checksum
        working-directory: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          mapfile -d '' isos < <(find . -type f -name '*.iso' -print0)
          if (( ${#isos[@]} == 0 )); then
            echo "::error::No ISO was produced"
            exit 1
          fi
          sha256sum "${isos[@]}" > SHA256SUMS

      - name: Upload ISO and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anaconda-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
