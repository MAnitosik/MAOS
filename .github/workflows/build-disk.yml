---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-storage:
        description: "Upload the compressed ISO to storage.to instead of keeping it as a job artifact"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - disk_config/iso.toml
      - .github/workflows/build-disk.yml

permissions: {}

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Superseded pull request builds are cancelled; manual builds run to completion so uploads are not cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build disk image
    # 24.04 is the runner the builder action's own anaconda-iso CI uses. On 26.04 (podman 5.7, kernel 7.0),
    # osbuild's build sandbox was denied chown and mount calls during the RPM stage.
    runs-on: ubuntu-24.04
    # The build and artifact upload measured ~16 min. zstd -19 and the storage.to upload add unmeasured time on top.
    timeout-minutes: 90

    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          set -Eeuo pipefail
          # OCI references must be lowercase.
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "USER_UID=$(id -u)"
            echo "USER_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      # Pinned to main (the v10 rewrite). The v9 tag runs `apt-get remove powershell`, which fails on ubuntu-26.04
      # with "Unable to locate package". v10 does no apt removals and keeps the container tooling BIB needs.
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # main (v10)

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build disk image
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          # Required: the image declares no default root filesystem. Matches the Justfile's _build-bib (--rootfs=btrfs).
          rootfs: btrfs
          additional-args: --use-librepo=True

      - name: Upload to job artifacts
        if: inputs.upload-to-storage != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Install storage.to tools
        if: inputs.upload-to-storage == true && github.event_name != 'pull_request'
        run: |
          set -Eeuo pipefail
          missing=()
          for tool in jq zstd; do
            command -v "$tool" > /dev/null || missing+=("$tool")
          done
          if (( ${#missing[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Compress ISO
        id: compress
        if: inputs.upload-to-storage == true && github.event_name != 'pull_request'
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -Eeuo pipefail
          iso="$(find "$OUTPUT_DIR" -type f -name '*.iso' -print -quit)"
          if [[ -z "$iso" ]]; then
            echo "::error::No ISO found in $OUTPUT_DIR"
            exit 1
          fi
          mkdir -p release
          out="release/${IMAGE_NAME}.iso.zst"
          zstd -19 -T0 "$iso" -o "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Upload to storage.to
        id: upload
        if: inputs.upload-to-storage == true && github.event_name != 'pull_request'
        env:
          FILE: ${{ steps.compress.outputs.file }}
        run: |
          set -Eeuo pipefail

          api="https://storage.to/api/upload"
          name="$(basename "$FILE")"
          size="$(stat -c%s "$FILE")"
          visitor_token="$(cat /proc/sys/kernel/random/uuid)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Build request bodies with jq so every value is escaped correctly.
          init_body="$(jq -nc --arg filename "$name" --arg content_type application/zstd --argjson size "$size" \
            '{filename: $filename, content_type: $content_type, size: $size}')"

          init="$(curl -fsSL -X POST "$api/init" \
            -H "Content-Type: application/json" \
            -H "X-Visitor-Token: $visitor_token" \
            -d "$init_body")"

          upload_type="$(jq -r '.type' <<< "$init")"
          r2_key="$(jq -r '.r2_key' <<< "$init")"

          case "$upload_type" in
            single)
              upload_url="$(jq -r '.upload_url' <<< "$init")"
              curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 \
                --upload-file "$FILE" "$upload_url"
              ;;

            multipart)
              upload_id="$(jq -r '.upload_id' <<< "$init")"
              part_size="$(jq -r '.part_size' <<< "$init")"
              total_parts="$(jq -r '.total_parts' <<< "$init")"
              part="$tmp/part"
              headers="$tmp/headers"
              etags="$tmp/etags.jsonl"

              echo "Multipart upload: $total_parts parts of $part_size bytes"
              for ((i = 1; i <= total_parts; i++)); do
                echo "Uploading part $i/$total_parts"

                url="$(jq -r --arg n "$i" '.initial_urls[$n] // empty' <<< "$init")"
                if [[ -z "$url" ]]; then
                  url="$(curl -fsSL -X POST "$api/parts" \
                    -H "Content-Type: application/json" \
                    -d "$(jq -nc --arg id "$upload_id" --argjson n "$i" '{upload_id: $id, part_numbers: [$n]}')" \
                    | jq -r '.part_urls[0].url')"
                fi

                # Copy only this slice of the ISO rather than splitting the whole file onto disk first.
                dd if="$FILE" of="$part" bs=8M iflag=skip_bytes,count_bytes status=none \
                  skip="$(( (i - 1) * part_size ))" count="$part_size"

                curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 \
                  -D "$headers" --upload-file "$part" "$url"

                etag="$(tr -d '\r"' < "$headers" | awk -F': ' 'tolower($1) == "etag" { value = $2 } END { print value }')"
                if [[ -z "$etag" ]]; then
                  echo "::error::No ETag returned for part $i"
                  exit 1
                fi
                jq -nc --argjson n "$i" --arg etag "$etag" '{partNumber: $n, etag: $etag}' >> "$etags"
              done

              curl -fsSL -X POST "$api/complete-multipart" \
                -H "Content-Type: application/json" \
                -d "$(jq -nc --arg id "$upload_id" --slurpfile parts "$etags" '{upload_id: $id, parts: $parts}')" \
                > /dev/null
              ;;

            *)
              echo "::error::Unknown upload type: $upload_type"
              exit 1
              ;;
          esac

          confirm_body="$(jq -nc --arg filename "$name" --arg content_type application/zstd \
            --argjson size "$size" --arg r2_key "$r2_key" \
            '{filename: $filename, content_type: $content_type, size: $size, r2_key: $r2_key}')"

          confirm="$(curl -fsSL -X POST "$api/confirm" \
            -H "Content-Type: application/json" \
            -H "X-Visitor-Token: $visitor_token" \
            -d "$confirm_body")"

          url="$(jq -r '.file.url // empty' <<< "$confirm")"
          if [[ -z "$url" ]]; then
            echo "::error::Confirm response did not include a download URL"
            exit 1
          fi

          echo "Download URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
