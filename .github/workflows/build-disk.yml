---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-storage-to:
        description: 'Upload the ISO to storage.to'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'

# Read-only. Nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull request runs can be superseded. Manual runs are queued instead, so a
  # long ISO build is never cancelled part-way through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REGISTRY: 'ghcr.io/${{ github.repository_owner }}' # do not edit
  STORAGE_API: 'https://storage.to/api'
  UPLOAD_CONCURRENCY: '4'

jobs:
  build:
    name: Build disk images
    runs-on: ubuntu-26.04
    timeout-minutes: 120

    permissions:
      contents: read
      packages: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # image-template.env is the single source for the image name, tag and builder image.
      - name: Load image settings
        run: |
          set -Eeuo pipefail
          set -a
          # shellcheck source=image-template.env
          source image-template.env
          set +a
          {
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "DEFAULT_TAG=${DEFAULT_TAG}"
            echo "BIB_IMAGE=${BIB_IMAGE}"
            echo "USER_UID=$(id -u)"
            echo "USER_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Mount BTRFS for container storage
        # Pinned to a commit on the action's main branch (merged 2025-08-03).
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Build ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Locate ISO
        id: iso
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -Eeuo pipefail
          iso="$(find "${OUTPUT_DIR}" -type f -name '*.iso' -print -quit)"
          if [[ -z "${iso}" ]]; then
            echo "::error::No .iso file found in ${OUTPUT_DIR}"
            exit 1
          fi
          echo "path=${iso}" >> "$GITHUB_OUTPUT"

      - name: Upload ISO as job artifact
        if: inputs.upload-to-storage-to != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload ISO to storage.to
        if: inputs.upload-to-storage-to == true && github.event_name != 'pull_request'
        id: upload
        env:
          FILE: ${{ steps.iso.outputs.path }}
          UPLOAD_NAME: ${{ env.IMAGE_NAME }}.iso
          API: ${{ env.STORAGE_API }}
          CONCURRENCY: ${{ env.UPLOAD_CONCURRENCY }}
        run: |
          set -Eeuo pipefail

          work="$(mktemp -d "${RUNNER_TEMP}/storage-upload.XXXXXX")"
          trap 'rm -rf "${work}"' EXIT

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          # POST a JSON body to the storage API. Extra arguments are passed to curl (headers).
          api() {
            local path="$1" body="$2"
            shift 2
            curl -fsSL -X POST "${API}/${path}" -H 'Content-Type: application/json' "$@" \
              --data-binary "${body}"
          }

          # Upload one part of a multipart upload. xargs runs this in a separate bash
          # process, so every variable it reads is exported below.
          upload_part() {
            set -Eeuo pipefail
            local n="$1" url etag part_file headers
            part_file="${work}/part-${n}"
            headers="${work}/headers-${n}"

            # Copy exactly this byte range out of the archive, so the file is never duplicated on disk.
            dd if="${FILE}" of="${part_file}" bs=4M iflag=skip_bytes,count_bytes \
              skip="$(( (n - 1) * PART_SIZE ))" count="${PART_SIZE}" status=none

            # shellcheck disable=SC2016
            url="$(jq -r --arg n "${n}" '.initial_urls[$n] // empty' "${work}/init.json")"
            if [[ -z "${url}" ]]; then
              # shellcheck disable=SC2016
              url="$(api upload/parts \
                "$(jq -cn --arg id "${UPLOAD_ID}" --argjson n "${n}" '{upload_id: $id, part_numbers: [$n]}')" \
                | jq -r '.part_urls[0].url // empty')"
            fi
            [[ -n "${url}" ]] || { echo "No upload URL returned for part ${n}" >&2; return 1; }

            curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 \
              -D "${headers}" --upload-file "${part_file}" "${url}" >/dev/null

            # The ETag is needed to complete the upload. Strip the quotes it arrives with.
            etag="$(awk 'tolower($1) == "etag:" { value = $2 } END { print value }' "${headers}" | tr -d '\r"')"
            [[ -n "${etag}" ]] || { echo "No ETag returned for part ${n}" >&2; return 1; }

            printf '%s' "${etag}" > "${work}/etag-${n}"
            rm -f "${part_file}" "${headers}"
          }

          visitor_token="$(cat /proc/sys/kernel/random/uuid)"
          size="$(stat -c%s "${FILE}")"
          mime="application/x-iso9660-image"

          # shellcheck disable=SC2016
          init_body="$(jq -cn --arg filename "${UPLOAD_NAME}" --arg content_type "${mime}" --argjson size "${size}" \
            '{filename: $filename, content_type: $content_type, size: $size}')"
          api upload/init "${init_body}" -H "X-Visitor-Token: ${visitor_token}" > "${work}/init.json"

          upload_type="$(jq -r '.type // empty' "${work}/init.json")"
          r2_key="$(jq -r '.r2_key // empty' "${work}/init.json")"
          [[ -n "${r2_key}" ]] || fail "Upload init returned no r2_key"

          case "${upload_type}" in
            single)
              upload_url="$(jq -r '.upload_url // empty' "${work}/init.json")"
              [[ -n "${upload_url}" ]] || fail "Single-part upload returned no upload_url"
              curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 \
                --upload-file "${FILE}" "${upload_url}" >/dev/null
              ;;
            multipart)
              UPLOAD_ID="$(jq -r '.upload_id // empty' "${work}/init.json")"
              PART_SIZE="$(jq -r '.part_size // empty' "${work}/init.json")"
              total_parts="$(jq -r '.total_parts // empty' "${work}/init.json")"
              [[ -n "${UPLOAD_ID}" && "${PART_SIZE}" =~ ^[0-9]+$ && "${total_parts}" =~ ^[1-9][0-9]*$ ]] \
                || fail "Multipart init response is missing upload_id, part_size or total_parts"

              echo "Uploading ${total_parts} parts of ${PART_SIZE} bytes, ${CONCURRENCY} at a time"
              export work FILE PART_SIZE UPLOAD_ID API
              export -f api upload_part
              # $1 must expand in the child bash process, not in this one.
              # shellcheck disable=SC2016
              seq 1 "${total_parts}" | xargs -P "${CONCURRENCY}" -I{} bash -c 'upload_part "$1"' _ {}

              # Build the completion payload in part order from the recorded ETags.
              parts_json="$(
                for (( n = 1; n <= total_parts; n++ )); do
                  # shellcheck disable=SC2016
                  jq -cn --argjson n "${n}" --arg etag "$(< "${work}/etag-${n}")" '{partNumber: $n, etag: $etag}'
                done | jq -cs '.'
              )"
              # shellcheck disable=SC2016
              complete_body="$(jq -cn --arg id "${UPLOAD_ID}" --argjson parts "${parts_json}" \
                '{upload_id: $id, parts: $parts}')"
              api upload/complete-multipart "${complete_body}" >/dev/null
              ;;
            *)
              fail "Unknown upload type: ${upload_type}"
              ;;
          esac

          # shellcheck disable=SC2016
          confirm_body="$(jq -cn --arg filename "${UPLOAD_NAME}" --arg content_type "${mime}" \
            --argjson size "${size}" --arg r2_key "${r2_key}" \
            '{filename: $filename, content_type: $content_type, size: $size, r2_key: $r2_key}')"
          api upload/confirm "${confirm_body}" -H "X-Visitor-Token: ${visitor_token}" > "${work}/confirm.json"

          url="$(jq -r '.file.url // empty' "${work}/confirm.json")"
          [[ -n "${url}" ]] || fail "Upload was confirmed but the response had no file URL"

          echo "Download URL: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### ISO uploaded to storage.to"
            echo ""
            echo "${url}"
          } >> "$GITHUB_STEP_SUMMARY"
