---
name: Build container image

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '5 10 * * *'  # 10:05 UTC daily
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'artifacthub-repo.yml'
      - '.github/dependabot.yml'
      - '.github/renovate.json5'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: 'ghcr.io/${{ github.repository_owner }}'

# One run per ref. Runs on the default branch queue instead of cancelling, so a
# publish is never interrupted partway through pushing tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Check Just syntax
        run: just check

      # image-template.env is the single source of truth for the image name and tag.
      - name: Resolve image name and tag
        run: |
          set -euo pipefail
          image_name="$(just image_name)"
          default_tag="$(just generate-default-tag)"
          {
            echo "IMAGE_NAME=${image_name,,}"        # GHCR requires lowercase repository paths
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "DEFAULT_TAG=${default_tag}"
          } >> "${GITHUB_ENV}"

      - name: Build image
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Optional: rpm-ostree rechunking produces smaller delta updates. To use the
      # distro-agnostic chunkah rechunker instead, run
      # `just rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"` here (https://github.com/coreos/chunkah).
      - name: Rechunk image (rpm-ostree)
        run: just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Generate build tags
        id: tags
        run: |
          set -euo pipefail
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags for this build: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      # The steps below run only for pushes to the default branch. Pull requests
      # build and test the image but never publish packages or signatures.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          digestfile="$(mktemp)"
          read -r -a tags <<< "${ALIAS_TAGS}"
          for tag in "${tags[@]}"; do
            # --retry absorbs transient registry failures. All tags share one manifest digest.
            podman push \
              --retry 5 \
              --retry-delay 10s \
              --digestfile "${digestfile}" \
              "${IMAGE_NAME}:${tag}" \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          echo "digest=$(< "${digestfile}")" >> "${GITHUB_OUTPUT}"

      # Signing is for images you distribute to others. Delete these steps if you don't need
      # them. Otherwise, SIGNING_SECRET must hold the cosign private key that matches cosign.pub.
      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Be careful when upgrading major versions. The sign step below targets cosign v3.
          cosign-release: 'v3.1.3'

      # Signs the image digest rather than a mutable tag, so one signature covers every tag.
      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # Old bundle format, so cosign 3.x can be used. See:
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  # The installer image for the ISO. It is built on every run, so pull requests check the
  # Containerfile, and it is published only from the default branch.
  build_installer:
    name: Build installer image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write  # push the installer image to ghcr.io

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Resolve image name and tag
        run: |
          set -euo pipefail
          image_name="$(just image_name)"
          default_tag="$(just generate-default-tag)"
          {
            echo "IMAGE_NAME=${image_name,,}"
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "DEFAULT_TAG=${default_tag}"
          } >> "${GITHUB_ENV}"

      # TARGET_IMAGE is the payload that the installer installs and tracks for updates.
      # The installer is built as root because the Containerfile needs root privileges.
      - name: Build installer image
        run: |
          set -euo pipefail
          sudo podman build \
            --build-arg TARGET_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --tag "${IMAGE_REGISTRY}/${IMAGE_NAME}-installer:${DEFAULT_TAG}" \
            --file installer/Containerfile \
            installer

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_PASSWORD}" | sudo podman login ghcr.io --username "${REGISTRY_USER}" --password-stdin

      - name: Push installer image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: sudo podman push "${IMAGE_REGISTRY}/${IMAGE_NAME}-installer:${DEFAULT_TAG}"
