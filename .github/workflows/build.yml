---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

# Pull request builds are superseded by newer pushes. Builds on main and scheduled builds always finish, so a
# publish is never cut off between pushing tags and signing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    timeout-minutes: 90  # successful builds have taken 27-40 minutes; this only stops hung jobs

    permissions:
      contents: read
      packages: write

    # Login, push and signing only run for non-PR events on the default branch.
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    defaults:
      run:
        shell: bash

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # main (v10)

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just syntax
        run: just check

      - name: Resolve image name and tag
        run: |
          set -euo pipefail
          image_name="$(just image_name)"
          default_tag="$(just generate-default-tag)"
          {
            echo "IMAGE_NAME=${image_name,,}"
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "DEFAULT_TAG=${default_tag}"
          } >> "$GITHUB_ENV"

      # This actually builds the container image
      - name: Build image
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        run: just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # To use the distro-agnostic rechunker instead, replace the step above with:
      #   just rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"
      # https://github.com/coreos/chunkah

      - name: Generate build tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags for this build: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "$GITHUB_OUTPUT"

      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push-image
        if: env.PUBLISH == 'true'
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "${ALIAS_TAGS}"

          # Push one image, retrying transient registry errors. Every attempt rewrites the digest file.
          push_with_retry() {
            local src="$1" dest="$2" attempt
            for attempt in 1 2 3 4 5; do
              echo "Pushing ${dest} (attempt ${attempt}/5)"
              if podman push --digestfile=/tmp/digestfile "${src}" "${dest}"; then
                return 0
              fi
              if (( attempt < 5 )); then
                echo "Push of ${dest} failed, retrying in 10 seconds"
                sleep 10
              fi
            done
            echo "::error::Push of ${dest} failed after 5 attempts"
            return 1
          }

          for tag in "${tags[@]}"; do
            push_with_retry "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      # Signing needs the SIGNING_SECRET repository secret; see the image signing section of the README.
      - name: Install Cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      - name: Sign container image
        if: env.PUBLISH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
