---
name: Build container image

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *' # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

# Read-only by default. The build job requests the extra scope it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede outdated pull request builds. Never cancel a run on the default
  # branch, because it may already be publishing an image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REGISTRY: 'ghcr.io/${{ github.repository_owner }}' # do not edit

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    env:
      # Pull requests build and validate only. Pushing and signing happen on the default branch.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just syntax
        run: just check

      - name: Resolve image name and tag
        run: |
          set -Eeuo pipefail
          image_name="$(just image_name)"
          default_tag="$(just generate-default-tag)"
          {
            # GHCR repository paths must be lowercase.
            echo "IMAGE_NAME=${image_name,,}"
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "DEFAULT_TAG=${default_tag}"
          } >> "$GITHUB_ENV"

      # The Justfile is the single build definition, so CI and `just build` produce the same image.
      - name: Build image
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Optional. Gives smaller delta updates. The Justfile also provides `just rechunk` (chunkah).
      - name: Rechunk with rpm-ostree
        run: just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Generate build tags
        id: tags
        run: |
          set -Eeuo pipefail
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags for this run: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "$GITHUB_OUTPUT"

      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
          DIGEST_FILE: ${{ runner.temp }}/digestfile
        run: |
          set -Eeuo pipefail

          # Registry pushes fail transiently, so retry with exponential backoff.
          retry() {
            local attempt delay=10
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if (( attempt < 5 )); then
                echo "Attempt ${attempt} failed, retrying in ${delay}s..." >&2
                sleep "${delay}"
                delay=$(( delay * 2 ))
              fi
            done
            echo "::error::Giving up after 5 attempts: $*" >&2
            return 1
          }

          read -ra tags <<< "${ALIAS_TAGS}"
          for tag in "${tags[@]}"; do
            retry podman push --digestfile="${DIGEST_FILE}" \
              "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          # Every tag points at the same manifest, so one digest covers all of them.
          echo "digest=$(< "${DIGEST_FILE}")" >> "$GITHUB_OUTPUT"

      # Optional. Only needed if you distribute the image: it requires the SIGNING_SECRET
      # repository secret. See the image signing section of the README.
      - name: Install Cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        if: env.PUBLISH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # Use the old bundle format so cosign 3.x can be used instead of 2.x.
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
